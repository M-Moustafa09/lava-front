<div class="space-y-4">
    <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
        <div class="p-4 bg-muted/30 border-b border-border font-medium">{{ 'DASHBOARD.AUTO_STR_404' | translate }}</div>
        <div class="p-4 space-y-3">
            <label class="flex flex-col gap-1.5"><span class="text-sm font-medium">{{ 'DASHBOARD.AUTO_STR_178' | translate }}</span><input type="text" [ngModel]="config().pageTitle" (ngModelChange)="updateConfig('pageTitle', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" /></label>
            <label class="flex flex-col gap-1.5"><span class="text-sm font-medium">{{ 'DASHBOARD.AUTO_STR_290' | translate }}</span><input type="text" [ngModel]="config().successMessage" (ngModelChange)="updateConfig('successMessage', $event)" class="lk-input h-10 px-3 rounded-xl border border-border" /></label>
        </div>
    </div>
    <div class="bg-card border border-border rounded-2xl overflow-hidden mb-4">
        <div class="p-4 bg-muted/30 border-b border-border font-medium">{{ 'DASHBOARD.AUTO_STR_291' | translate }}</div>
        <div class="p-4 space-y-3">
            <label class="flex items-center justify-between"><span class="text-sm font-medium">{{ 'DASHBOARD.AUTO_STR_121' | translate }}</span><input type="checkbox" [ngModel]="config().showOrderDetails" (ngModelChange)="updateConfig('showOrderDetails', $event)" class="lk-checkbox" /></label>
            <label class="flex items-center justify-between"><span class="text-sm font-medium">{{ 'DASHBOARD.AUTO_STR_69' | translate }}</span><input type="checkbox" [ngModel]="config().showNextSteps" (ngModelChange)="updateConfig('showNextSteps', $event)" class="lk-checkbox" /></label>
        </div>
    </div>
</div>
